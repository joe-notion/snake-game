<!DOCTYPE html>
<html>
<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    border: 1px solid white;
  }

  /* shared full-screen overlay used by the start screen and game over screen */
  #start-screen,
  #game-over-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.92);
    z-index: 10;
  }
  #start-screen.hidden,
  #game-over-screen.hidden {
    display: none;
  }
  .menu {
    width: 100%;
    max-width: 360px;
    text-align: center;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .menu h1 {
    margin: 0 0 12px;
    font-size: 40px;
    letter-spacing: 2px;
    color: #4caf50;
  }
  .menu .goal {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.5;
  }
  .how-to-play {
    text-align: left;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 8px;
  }
  .how-to-play h2 {
    margin: 0 0 8px;
    font-size: 16px;
    color: #ffffff;
  }
  .how-to-play ul {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .how-to-play .mobile-note {
    margin: 10px 0 0;
    font-size: 13px;
    color: #bbbbbb;
  }
  /* mode selection (Classic / Maze) on the start screen */
  .mode-select {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 0 0 10px;
  }
  .mode-option {
    flex: 1;
    padding: 10px 0;
    font-size: 15px;
    font-weight: bold;
    color: #ffffff;
    background: #1b1b1b;
    border: 1px solid #444444;
    border-radius: 8px;
    cursor: pointer;
  }
  .mode-option:hover {
    border-color: #777777;
  }
  .mode-option.is-active {
    color: #000000;
    background: #4caf50;
    border-color: #4caf50;
  }
  .mode-option:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  .mode-desc {
    margin: 0 0 20px;
    min-height: 1.2em;
    font-size: 14px;
    line-height: 1.4;
    color: #bbbbbb;
    font-family: Arial, Helvetica, sans-serif;
  }
  /* game over specifics */
  #game-over-screen h1 {
    color: #e53935;
  }
  .final-score {
    margin: 0 0 6px;
    font-size: 18px;
  }
  .final-score .score-value {
    display: block;
    margin-top: 4px;
    font-size: 48px;
    font-weight: bold;
    color: #4caf50;
  }
  .death-reason {
    margin: 0 0 24px;
    font-size: 15px;
    color: #bbbbbb;
  }
  /* buttons */
  #play-button,
  #restart-button {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #play-button:hover,
  #restart-button:hover {
    background: #5bc75f;
  }
  #menu-button {
    display: block;
    margin: 12px auto 0;
    padding: 10px 28px;
    font-size: 15px;
    color: #ffffff;
    background: transparent;
    border: 1px solid #666666;
    border-radius: 8px;
    cursor: pointer;
  }
  #menu-button:hover {
    border-color: #999999;
  }
  #play-button:focus,
  #restart-button:focus,
  #menu-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  </style>
</head>
<body>
<div id="start-screen">
  <div class="menu">
    <h1>Snake</h1>
    <p class="goal">Eat the red apples to grow as long as you can &mdash; just don't crash into your own tail!</p>
    <div class="how-to-play">
      <h2>How to play</h2>
      <ul>
        <li><strong>Arrow keys</strong> &mdash; move up, down, left, and right</li>
      </ul>
      <p class="mobile-note">Mobile touch controls coming soon.</p>
    </div>
    <div class="mode-select" role="group" aria-label="Choose game mode">
      <button type="button" class="mode-option is-active" id="mode-classic" aria-pressed="true">Classic</button>
      <button type="button" class="mode-option" id="mode-maze" aria-pressed="false">Maze</button>
    </div>
    <p class="mode-desc" id="mode-desc">Classic: an open board with no internal walls.</p>
    <button type="button" id="play-button">Play</button>
  </div>
</div>
<div id="game-over-screen" class="hidden">
  <div class="menu">
    <h1>Game Over</h1>
    <p class="final-score">Final score<span class="score-value" id="final-score">0</span></p>
    <p class="death-reason" id="death-reason">You crashed into your own tail!</p>
    <button type="button" id="restart-button">Restart</button>
    <button type="button" id="menu-button">Back to Menu</button>
  </div>
</div>
<canvas width="400" height="400" id="game"></canvas>
<script src="maze.js"></script>
<script>
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');

// the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
// (e.g. 16 * 25 = 400)
var grid = 16;

// ---- Speed / timing configuration ----
// Snake movement uses a fixed timestep so the speed is identical on every
// display, regardless of the monitor's refresh rate (60 / 120 / 144 Hz).
// Previously the loop skipped a fixed number of animation frames (assuming
// 60fps), which made the snake run ~2x too fast on high-refresh-rate screens
// and felt too fast for beginners.
//
// INITIAL_TICK_MS is the single canonical starting-speed value: the number of
// milliseconds between snake moves. Larger = slower / more beginner-friendly.
var INITIAL_TICK_MS = 150;

// Current milliseconds-per-move. Speed progression is intentionally disabled
// for the MVP (a single constant speed for the whole session), so this stays
// equal to INITIAL_TICK_MS. To add progression later, adjust tickMs from a
// documented rule (e.g. decrease it every N apples eaten).
var tickMs = INITIAL_TICK_MS;

// timestamp (DOMHighResTimeStamp, ms) of the last snake move; drives the
// fixed-timestep accumulator in loop().
var lastMoveTime = 0;

// dev-only instrumentation: enable by adding ?debug=1 to the URL. Logs the
// effective interval between moves so QA can confirm the tick rate is
// consistent across browsers/devices. Silent during normal play.
var DEBUG = /[?&]debug=1(?:&|$)/.test(window.location.search);
var prevMoveTime = 0;

// number of apples eaten this run; shown on the Game Over screen
var score = 0;

// explicit game state machine so rendering/input know what to do
var STATE = { MENU: 'menu', PLAYING: 'playing', GAME_OVER: 'gameover' };
var state = STATE.MENU;
var loopStarted = false;

var snake = {
  x: 160,
  y: 160,

  // snake velocity. moves one grid length every frame in either the x or y direction
  dx: grid,
  dy: 0,

  // keep track of all grids the snake body occupies
  cells: [],

  // length of the snake. grows when eating an apple
  maxCells: 4
};
var apple = {
  x: 320,
  y: 320
};

// ---- Maze Mode ----
// gameMode is the mode for the current run; selectedMode is the menu choice.
// walls holds the active internal wall cells in PIXEL coords (empty in Classic
// Mode), and wallSet is a fast "x,y" -> true lookup used by collision checks and
// apple placement. The layout data + validation live in maze.js (SnakeMaze).
var gameMode = 'classic';
var selectedMode = 'classic';
var walls = [];
var wallSet = {};
var MAZE_LAYOUT_ID = 'arena';

// get random whole numbers in a specific range
// @see https://stackoverflow.com/a/1527820/2124254
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// true if the grid cell at these pixel coords is an internal maze wall
function isWallAt(x, y) {
  return wallSet[x + ',' + y] === true;
}

// true if the snake currently occupies the grid cell at these pixel coords
function snakeOccupies(x, y) {
  if (snake.x === x && snake.y === y) {
    return true;
  }
  for (var i = 0; i < snake.cells.length; i++) {
    if (snake.cells[i].x === x && snake.cells[i].y === y) {
      return true;
    }
  }
  return false;
}

// place the apple on a random grid cell. Classic Mode keeps the original
// behaviour exactly. Maze Mode additionally refuses walls and the snake's body
// so the apple is always reachable and never hidden inside an obstacle.
function placeApple() {
  if (walls.length === 0) {
    apple.x = getRandomInt(0, 25) * grid;
    apple.y = getRandomInt(0, 25) * grid;
    return;
  }

  var x, y, tries = 0;
  do {
    x = getRandomInt(0, 25) * grid;
    y = getRandomInt(0, 25) * grid;
    tries++;
  } while (tries < 1000 && (isWallAt(x, y) || snakeOccupies(x, y)));
  apple.x = x;
  apple.y = y;
}

// draw the internal maze walls. Walls are solid, full-cell blocks (no inter-cell
// gap) with a lighter inset, so they read as continuous barriers that are
// visually distinct from the gapped snake body and the apple - not relying on
// colour alone.
function drawWalls() {
  for (var i = 0; i < walls.length; i++) {
    context.fillStyle = '#5a6472';
    context.fillRect(walls[i].x, walls[i].y, grid, grid);
    context.fillStyle = '#828d9e';
    context.fillRect(walls[i].x + 2, walls[i].y + 2, grid - 4, grid - 4);
  }
}

// compact HUD badge so Maze Mode is clearly indicated during play
function drawModeBadge() {
  context.save();
  context.font = 'bold 12px Arial, Helvetica, sans-serif';
  context.textBaseline = 'middle';
  var label = 'MAZE MODE';
  var padX = 6;
  var w = context.measureText(label).width + padX * 2;
  context.fillStyle = 'rgba(90, 100, 114, 0.85)';
  context.fillRect(4, 4, w, 20);
  context.fillStyle = '#ffffff';
  context.fillText(label, 4 + padX, 15);
  context.restore();
}

// configure the active mode for a new run: build + validate the maze walls, or
// clear them for Classic. An invalid layout is never loaded - we log an
// actionable developer error and safely fall back to Classic Mode so a run is
// never silently unfair.
function applySelectedMode() {
  gameMode = selectedMode;
  walls = [];
  wallSet = {};

  if (gameMode !== 'maze') {
    return;
  }

  var cells = SnakeMaze.cellsFor(MAZE_LAYOUT_ID);
  var result = SnakeMaze.validateLayout(cells);
  if (!result.ok) {
    console.error('[maze] layout "' + MAZE_LAYOUT_ID + '" failed validation: ' +
                  result.reason + ' - falling back to Classic Mode.');
    gameMode = 'classic';
    return;
  }

  walls = cells.map(function (c) {
    return { x: c.x * grid, y: c.y * grid };
  });
  walls.forEach(function (w) {
    wallSet[w.x + ',' + w.y] = true;
  });

  if (DEBUG) {
    console.log('[maze] loaded layout "' + MAZE_LAYOUT_ID + '" with ' +
                walls.length + ' wall cells, ' + result.openCells + ' open.');
  }
}

// game loop
function loop(timestamp) {
  requestAnimationFrame(loop);

  // only advance gameplay while PLAYING. In MENU and GAME_OVER the loop
  // stops updating so the last frame stays frozen on the board.
  if (state !== STATE.PLAYING) {
    return;
  }

  // Fixed timestep: only advance the game once at least tickMs of real time has
  // elapsed since the last move. This decouples the snake's speed from the
  // display refresh rate, so it ticks at the same rate on 60/120/144 Hz screens.
  if (timestamp - lastMoveTime < tickMs) {
    return;
  }

  // Advance the marker by exactly one interval so the cadence stays locked to
  // tickMs (rather than snapping to whole animation frames). If the tab was
  // backgrounded and we've fallen far behind, resync to now instead of bursting
  // several moves to "catch up".
  lastMoveTime += tickMs;
  if (timestamp - lastMoveTime > tickMs) {
    lastMoveTime = timestamp;
  }

  if (DEBUG) {
    if (prevMoveTime) {
      console.log('[snake] move interval ' + Math.round(timestamp - prevMoveTime) +
                  'ms (target ' + tickMs + 'ms)');
    }
    prevMoveTime = timestamp;
  }

  context.clearRect(0,0,canvas.width,canvas.height);

  // draw internal maze walls (no-op in Classic Mode: walls is empty)
  drawWalls();

  // move snake by it's velocity
  snake.x += snake.dx;
  snake.y += snake.dy;

  // wrap snake position horizontally on edge of screen
  if (snake.x < 0) {
    snake.x = canvas.width - grid;
  }
  else if (snake.x >= canvas.width) {
    snake.x = 0;
  }

  // wrap snake position vertically on edge of screen
  if (snake.y < 0) {
    snake.y = canvas.height - grid;
  }
  else if (snake.y >= canvas.height) {
    snake.y = 0;
  }

  // keep track of where snake has been. front of the array is always the head
  snake.cells.unshift({x: snake.x, y: snake.y});

  // remove cells as we move away from them
  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  // maze mode: running the head into an internal wall ends the run, using the
  // same Game Over flow as a self-collision (consistent terminal outcome)
  if (isWallAt(snake.x, snake.y)) {
    gameOver('You crashed into a maze wall!');
    return;
  }

  // draw apple
  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid-1, grid-1);

  // draw snake one cell at a time
  context.fillStyle = 'green';
  snake.cells.forEach(function(cell, index) {

    // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
    context.fillRect(cell.x, cell.y, grid-1, grid-1);

    // snake ate apple
    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;
      score++;

      // move the apple to a fresh cell (avoids walls + the snake in Maze Mode)
      placeApple();
    }

    // check collision with all cells after this one (modified bubble sort)
    for (var i = index + 1; i < snake.cells.length; i++) {

      // snake occupies same space as a body part. end the run and show Game Over
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        gameOver('You crashed into your own tail!');
        return;
      }
    }
  });

  // HUD: keep Maze Mode clearly indicated throughout the run
  if (gameMode === 'maze') {
    drawModeBadge();
  }
}

// listen to keyboard events to move the snake
document.addEventListener('keydown', function(e) {
  // while Game Over is showing, Enter or Space starts a fresh run and
  // directional keys must not affect the frozen board
  if (state === STATE.GAME_OVER) {
    if (e.which === 13 || e.which === 32) {
      e.preventDefault();
      startGame();
    }
    return;
  }

  // ignore movement keys unless actively playing (e.g. on the start screen)
  if (state !== STATE.PLAYING) {
    return;
  }

  // prevent snake from backtracking on itself by checking that it's
  // not already moving on the same axis (pressing left while moving
  // left won't do anything, and pressing right while moving left
  // shouldn't let you collide with your own body)

  // left arrow key
  if (e.which === 37 && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  }
  // up arrow key
  else if (e.which === 38 && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  }
  // right arrow key
  else if (e.which === 39 && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  }
  // down arrow key
  else if (e.which === 40 && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
});

// start screen / game over screen elements
var startScreen = document.getElementById('start-screen');
var playButton = document.getElementById('play-button');
var gameOverScreen = document.getElementById('game-over-screen');
var finalScoreEl = document.getElementById('final-score');
var deathReasonEl = document.getElementById('death-reason');
var restartButton = document.getElementById('restart-button');
var menuButton = document.getElementById('menu-button');

// mode selection (start screen)
var modeClassicBtn = document.getElementById('mode-classic');
var modeMazeBtn = document.getElementById('mode-maze');
var modeDescEl = document.getElementById('mode-desc');
var MODE_DESCRIPTIONS = {
  classic: 'Classic: an open board with no internal walls.',
  maze: 'Maze: internal walls block the board \u2014 touching one ends the run.'
};

// update the chosen mode and reflect it in the menu's toggle + description
function selectMode(mode) {
  selectedMode = mode;
  var isMaze = mode === 'maze';
  modeMazeBtn.classList.toggle('is-active', isMaze);
  modeClassicBtn.classList.toggle('is-active', !isMaze);
  modeMazeBtn.setAttribute('aria-pressed', isMaze ? 'true' : 'false');
  modeClassicBtn.setAttribute('aria-pressed', isMaze ? 'false' : 'true');
  modeDescEl.textContent = MODE_DESCRIPTIONS[mode];
}

// reset all game state back to its initial values
function resetGame() {
  snake.x = 160;
  snake.y = 160;
  snake.dx = grid;
  snake.dy = 0;
  snake.cells = [];
  snake.maxCells = 4;

  apple.x = 320;
  apple.y = 320;

  // reset speed back to the initial value and re-arm the fixed-timestep clock
  tickMs = INITIAL_TICK_MS;
  lastMoveTime = 0;
  prevMoveTime = 0;
  score = 0;
}

// stop gameplay and show the Game Over screen with the final score
function gameOver(reason) {
  // guard so the run only ends once even though we're mid-render loop
  if (state !== STATE.PLAYING) {
    return;
  }

  state = STATE.GAME_OVER;
  finalScoreEl.textContent = score;
  deathReasonEl.textContent = reason;
  gameOverScreen.classList.remove('hidden');

  // focus Restart so keyboard-only players can act immediately
  restartButton.focus();
}

// begin a fresh run from either the start screen or the Game Over screen
function startGame() {
  // idempotent: ignore repeat triggers (e.g. key + button firing together)
  if (state === STATE.PLAYING) {
    return;
  }

  // apply the chosen mode (builds + validates maze walls, or clears them) before
  // resetting, so the fresh run starts in the correct mode
  applySelectedMode();
  resetGame();
  // in Maze Mode, make sure the starting apple isn't sitting inside a wall
  if (gameMode === 'maze') {
    placeApple();
  }
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  state = STATE.PLAYING;

  // move focus off the buttons so gameplay keys aren't captured by them
  playButton.blur();
  restartButton.blur();

  // only ever kick off a single game loop
  if (!loopStarted) {
    loopStarted = true;
    requestAnimationFrame(loop);
  }
}

// return from Game Over to the start screen / main menu
function backToMenu() {
  state = STATE.MENU;
  gameOverScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  playButton.focus();
}

// buttons are actionable by mouse click and by keyboard (Enter/Space fire a click)
playButton.addEventListener('click', startGame);
restartButton.addEventListener('click', startGame);
menuButton.addEventListener('click', backToMenu);
modeClassicBtn.addEventListener('click', function () { selectMode('classic'); });
modeMazeBtn.addEventListener('click', function () { selectMode('maze'); });

// focus Play on load so keyboard-only players can start immediately
playButton.focus();
</script>
</body>
</html>
