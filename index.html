<!DOCTYPE html>
<html>
<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    border: 1px solid white;
  }

  /* start screen / main menu overlay */
  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.92);
    z-index: 10;
  }
  #start-screen.hidden {
    display: none;
  }
  .menu {
    width: 100%;
    max-width: 360px;
    text-align: center;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .menu h1 {
    margin: 0 0 12px;
    font-size: 40px;
    letter-spacing: 2px;
    color: #4caf50;
  }
  .menu .goal {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.5;
  }
  .how-to-play {
    text-align: left;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 8px;
  }
  .how-to-play h2 {
    margin: 0 0 8px;
    font-size: 16px;
    color: #ffffff;
  }
  .how-to-play ul {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .how-to-play .mobile-note {
    margin: 10px 0 0;
    font-size: 13px;
    color: #bbbbbb;
  }
  #play-button {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #play-button:hover {
    background: #5bc75f;
  }
  #play-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  /* mute / unmute toggle, pinned to the top-right of the viewport so it's
     reachable from both the start screen and during gameplay */
  #mute-button {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    width: 44px;
    height: 44px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid #4caf50;
    border-radius: 8px;
    cursor: pointer;
  }
  #mute-button:hover {
    background: rgba(76, 175, 80, 0.25);
  }
  #mute-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  </style>
</head>
<body>
<button type="button" id="mute-button" aria-pressed="false" aria-label="Mute sound">&#128266;</button>
<div id="start-screen">
  <div class="menu">
    <h1>Snake</h1>
    <p class="goal">Eat the red apples to grow as long as you can &mdash; just don't crash into your own tail!</p>
    <div class="how-to-play">
      <h2>How to play</h2>
      <ul>
        <li><strong>Arrow keys</strong> &mdash; move up, down, left, and right</li>
        <li><strong>M</strong> or the &#128266; button &mdash; mute / unmute sound</li>
      </ul>
      <p class="mobile-note">Mobile touch controls coming soon.</p>
    </div>
    <button type="button" id="play-button">Play</button>
  </div>
</div>
<canvas width="400" height="400" id="game"></canvas>
<script>
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');

// ---- Audio (Web Audio API, all sounds synthesized) ----
// Every game sound is generated at runtime with the Web Audio API, so there
// are no audio files to download and no licensing to worry about. A single
// master GainNode doubles as the mute switch (gain 0 = muted), giving us one
// master control for both SFX and music (per the MVP scope).
//
// The AudioContext is created lazily on the first user gesture (Play click or
// mute-button click) so we never trip browser autoplay policies or log
// autoplay errors on initial load. If the browser has no Web Audio support the
// game keeps working, just silently.
var audio = (function () {
  var STORAGE_KEY = 'snakeMuted';
  var ctx = null;          // AudioContext, created on first gesture
  var masterGain = null;   // master volume node; acts as the mute switch
  var musicTimer = null;   // setInterval handle for the background-music scheduler
  var musicStep = 0;       // position within the looping melody

  // Sound defaults to ON; we only honour an explicit saved "muted" preference,
  // so a returning player who muted last time stays muted across reloads.
  var muted = readStoredMuted();

  // localStorage can throw (private mode, sandboxed iframes); never let a
  // storage error break the game.
  function readStoredMuted() {
    try { return localStorage.getItem(STORAGE_KEY) === '1'; }
    catch (e) { return false; }
  }
  function writeStoredMuted(value) {
    try { localStorage.setItem(STORAGE_KEY, value ? '1' : '0'); }
    catch (e) { /* ignore: preference just won't persist */ }
  }

  // Create the AudioContext + master gain the first time we're allowed to, and
  // resume it if the browser started it "suspended".
  function ensureContext() {
    if (ctx) {
      if (ctx.state === 'suspended') { ctx.resume(); }
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return; }
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(ctx.destination);
  }

  // Play a single oscillator tone. Used to build every SFX and music note.
  // A tiny attack/release envelope avoids audible clicks.
  function tone(opts) {
    if (!ctx) { return; }
    var t0 = ctx.currentTime + (opts.delay || 0);
    var dur = opts.duration;
    var peak = opts.gain || 0.2;

    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = opts.type || 'square';
    osc.frequency.setValueAtTime(opts.freq, t0);
    if (opts.freqEnd) {
      osc.frequency.exponentialRampToValueAtTime(opts.freqEnd, t0 + dur);
    }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  // Short, bright blip when an apple is eaten (low latency: fires immediately).
  function eat() {
    ensureContext();
    tone({ type: 'square', freq: 520, freqEnd: 880, duration: 0.09, gain: 0.25 });
  }

  // Distinct descending "you died" stinger on game over.
  function gameOver() {
    ensureContext();
    tone({ type: 'sawtooth', freq: 420, freqEnd: 200, duration: 0.18, gain: 0.28 });
    tone({ type: 'sawtooth', freq: 200, freqEnd: 90, duration: 0.34, gain: 0.28, delay: 0.16 });
    // Restart the background loop so a fresh life begins from the top of the
    // melody rather than mid-phrase.
    musicStep = 0;
  }

  // Subtle looping background melody (a low-volume pentatonic arpeggio). The
  // final 0 is a rest so the loop breathes.
  var MELODY = [220, 261.63, 329.63, 440, 329.63, 261.63, 220, 0];
  function startMusic() {
    ensureContext();
    if (!ctx || musicTimer) { return; }
    musicStep = 0;
    musicTimer = setInterval(function () {
      var freq = MELODY[musicStep % MELODY.length];
      musicStep++;
      if (freq) {
        tone({ type: 'triangle', freq: freq, duration: 0.22, gain: 0.05 });
      }
    }, 260);
  }

  // Apply a mute state and persist it. Ramps the master gain to avoid a click.
  function setMuted(next) {
    muted = next;
    writeStoredMuted(muted);
    if (masterGain) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.015);
    }
  }
  function toggleMute() {
    ensureContext(); // a mute-button click is itself a valid user gesture
    setMuted(!muted);
    return muted;
  }

  return {
    isMuted: function () { return muted; },
    ensureContext: ensureContext,
    eat: eat,
    gameOver: gameOver,
    startMusic: startMusic,
    toggleMute: toggleMute
  };
})();

// the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
// (e.g. 16 * 25 = 400)
var grid = 16;

// ---- Speed / timing configuration ----
// Snake movement uses a fixed timestep so the speed is identical on every
// display, regardless of the monitor's refresh rate (60 / 120 / 144 Hz).
// Previously the loop skipped a fixed number of animation frames (assuming
// 60fps), which made the snake run ~2x too fast on high-refresh-rate screens
// and felt too fast for beginners.
//
// INITIAL_TICK_MS is the single canonical starting-speed value: the number of
// milliseconds between snake moves. Larger = slower / more beginner-friendly.
var INITIAL_TICK_MS = 150;

// Current milliseconds-per-move. Speed progression is intentionally disabled
// for the MVP (a single constant speed for the whole session), so this stays
// equal to INITIAL_TICK_MS. To add progression later, adjust tickMs from a
// documented rule (e.g. decrease it every N apples eaten).
var tickMs = INITIAL_TICK_MS;

// timestamp (DOMHighResTimeStamp, ms) of the last snake move; drives the
// fixed-timestep accumulator in loop().
var lastMoveTime = 0;

// dev-only instrumentation: enable by adding ?debug=1 to the URL. Logs the
// effective interval between moves so QA can confirm the tick rate is
// consistent across browsers/devices. Silent during normal play.
var DEBUG = /[?&]debug=1(?:&|$)/.test(window.location.search);
var prevMoveTime = 0;

var snake = {
  x: 160,
  y: 160,

  // snake velocity. moves one grid length every frame in either the x or y direction
  dx: grid,
  dy: 0,

  // keep track of all grids the snake body occupies
  cells: [],

  // length of the snake. grows when eating an apple
  maxCells: 4
};
var apple = {
  x: 320,
  y: 320
};

// get random whole numbers in a specific range
// @see https://stackoverflow.com/a/1527820/2124254
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// game loop
function loop(timestamp) {
  requestAnimationFrame(loop);

  // Fixed timestep: only advance the game once at least tickMs of real time has
  // elapsed since the last move. This decouples the snake's speed from the
  // display refresh rate, so it ticks at the same rate on 60/120/144 Hz screens.
  if (timestamp - lastMoveTime < tickMs) {
    return;
  }

  // Advance the marker by exactly one interval so the cadence stays locked to
  // tickMs (rather than snapping to whole animation frames). If the tab was
  // backgrounded and we've fallen far behind, resync to now instead of bursting
  // several moves to "catch up".
  lastMoveTime += tickMs;
  if (timestamp - lastMoveTime > tickMs) {
    lastMoveTime = timestamp;
  }

  if (DEBUG) {
    if (prevMoveTime) {
      console.log('[snake] move interval ' + Math.round(timestamp - prevMoveTime) +
                  'ms (target ' + tickMs + 'ms)');
    }
    prevMoveTime = timestamp;
  }

  context.clearRect(0,0,canvas.width,canvas.height);

  // move snake by it's velocity
  snake.x += snake.dx;
  snake.y += snake.dy;

  // wrap snake position horizontally on edge of screen
  if (snake.x < 0) {
    snake.x = canvas.width - grid;
  }
  else if (snake.x >= canvas.width) {
    snake.x = 0;
  }

  // wrap snake position vertically on edge of screen
  if (snake.y < 0) {
    snake.y = canvas.height - grid;
  }
  else if (snake.y >= canvas.height) {
    snake.y = 0;
  }

  // keep track of where snake has been. front of the array is always the head
  snake.cells.unshift({x: snake.x, y: snake.y});

  // remove cells as we move away from them
  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  // draw apple
  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid-1, grid-1);

  // draw snake one cell at a time
  context.fillStyle = 'green';
  // guard so the game-over sound plays at most once per tick even if several
  // body cells overlap the head on the same frame
  var gameOverThisTick = false;
  snake.cells.forEach(function(cell, index) {

    // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
    context.fillRect(cell.x, cell.y, grid-1, grid-1);

    // snake ate apple
    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;

      // play a short "eat" sound effect (fires once per apple eaten)
      audio.eat();

      // canvas is 400x400 which is 25x25 grids
      apple.x = getRandomInt(0, 25) * grid;
      apple.y = getRandomInt(0, 25) * grid;
    }

    // check collision with all cells after this one (modified bubble sort)
    for (var i = index + 1; i < snake.cells.length; i++) {

      // snake occupies same space as a body part. reset game
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        // play a distinct game-over sound once for this collision
        if (!gameOverThisTick) {
          audio.gameOver();
          gameOverThisTick = true;
        }

        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;

        apple.x = getRandomInt(0, 25) * grid;
        apple.y = getRandomInt(0, 25) * grid;
      }
    }
  });
}

// listen to keyboard events to move the snake
document.addEventListener('keydown', function(e) {
  // ignore movement keys until the game has started from the start screen
  if (!running) {
    return;
  }

  // prevent snake from backtracking on itself by checking that it's
  // not already moving on the same axis (pressing left while moving
  // left won't do anything, and pressing right while moving left
  // shouldn't let you collide with your own body)

  // left arrow key
  if (e.which === 37 && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  }
  // up arrow key
  else if (e.which === 38 && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  }
  // right arrow key
  else if (e.which === 39 && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  }
  // down arrow key
  else if (e.which === 40 && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
});

// start screen: the game waits in a "not started" state until Play is pressed
var running = false;
var loopStarted = false;
var startScreen = document.getElementById('start-screen');
var playButton = document.getElementById('play-button');

// reset all game state back to its initial values
function resetGame() {
  snake.x = 160;
  snake.y = 160;
  snake.dx = grid;
  snake.dy = 0;
  snake.cells = [];
  snake.maxCells = 4;

  apple.x = 320;
  apple.y = 320;

  // reset speed back to the initial value and re-arm the fixed-timestep clock
  tickMs = INITIAL_TICK_MS;
  lastMoveTime = 0;
  prevMoveTime = 0;
}

// dismiss the start screen and begin gameplay
function startGame() {
  resetGame();
  startScreen.classList.add('hidden');
  running = true;

  // clicking Play is a user gesture, so it's safe to start audio here without
  // tripping browser autoplay restrictions: arm the context and start the
  // subtle background music (both respect the persisted mute preference)
  audio.ensureContext();
  audio.startMusic();

  // move focus off the button so gameplay keys aren't captured by it
  playButton.blur();

  // only ever kick off a single game loop
  if (!loopStarted) {
    loopStarted = true;
    requestAnimationFrame(loop);
  }
}

// Play is actionable by mouse click and by keyboard (Enter/Space fire a click)
playButton.addEventListener('click', startGame);

// ---- Mute toggle wiring ----
var muteButton = document.getElementById('mute-button');

// keep the button's icon + accessibility state in sync with the audio module
function syncMuteButton() {
  var muted = audio.isMuted();
  muteButton.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A'; // 🔇 / 🔊
  muteButton.setAttribute('aria-pressed', muted ? 'true' : 'false');
  muteButton.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
}

muteButton.addEventListener('click', function() {
  audio.toggleMute();
  syncMuteButton();
});

// keyboard shortcut: "M" mutes/unmutes at any time (start screen or in-game)
document.addEventListener('keydown', function(e) {
  if (e.key === 'm' || e.key === 'M') {
    audio.toggleMute();
    syncMuteButton();
  }
});

// reflect any saved mute preference in the button on load
syncMuteButton();

// focus Play on load so keyboard-only players can start immediately
playButton.focus();
</script>
</body>
</html>
