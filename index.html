<!DOCTYPE html>
<html>
<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    border: 1px solid white;
  }

  /* start screen / main menu overlay */
  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.92);
    z-index: 10;
  }
  #start-screen.hidden {
    display: none;
  }
  .menu {
    width: 100%;
    max-width: 360px;
    text-align: center;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .menu h1 {
    margin: 0 0 12px;
    font-size: 40px;
    letter-spacing: 2px;
    color: #4caf50;
  }
  .menu .goal {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.5;
  }
  .how-to-play {
    text-align: left;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 8px;
  }
  .how-to-play h2 {
    margin: 0 0 8px;
    font-size: 16px;
    color: #ffffff;
  }
  .how-to-play ul {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .how-to-play .mobile-note {
    margin: 10px 0 0;
    font-size: 13px;
    color: #bbbbbb;
  }
  #play-button {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #play-button:hover {
    background: #5bc75f;
  }
  #play-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  /* game area wrapper so the pause control + overlay can be positioned
     relative to the canvas (works the same on desktop and mobile) */
  #game-wrap {
    position: relative;
  }
  #game-wrap canvas {
    display: block;
  }

  /* in-HUD pause / resume control, top-right of the play field */
  #pause-button {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    min-width: 44px;
    min-height: 44px;
    padding: 10px 16px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid #4caf50;
    border-radius: 8px;
    cursor: pointer;
  }
  #pause-button:hover {
    background: rgba(76, 175, 80, 0.35);
  }
  #pause-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  #pause-button.hidden {
    display: none;
  }

  /* paused overlay: dims the frozen play field and explains how to resume */
  #pause-screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.6);
    z-index: 8;
    cursor: pointer;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    text-align: center;
  }
  #pause-screen.hidden {
    display: none;
  }
  #pause-screen h2 {
    margin: 0 0 8px;
    font-size: 34px;
    letter-spacing: 2px;
    color: #4caf50;
  }
  #pause-screen .pause-hint {
    margin: 0 0 20px;
    font-size: 15px;
    line-height: 1.5;
  }
  #resume-button {
    padding: 12px 36px;
    font-size: 16px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #resume-button:hover {
    background: #5bc75f;
  }
  #resume-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  </style>
</head>
<body>
<div id="start-screen">
  <div class="menu">
    <h1>Snake</h1>
    <p class="goal">Eat the red apples to grow as long as you can &mdash; just don't crash into your own tail!</p>
    <div class="how-to-play">
      <h2>How to play</h2>
      <ul>
        <li><strong>Arrow keys</strong> &mdash; move up, down, left, and right</li>
        <li><strong>P</strong> or <strong>Space</strong> &mdash; pause / resume</li>
      </ul>
      <p class="mobile-note">Mobile touch controls coming soon.</p>
    </div>
    <button type="button" id="play-button">Play</button>
  </div>
</div>
<div id="game-wrap">
  <canvas width="400" height="400" id="game"></canvas>
  <button type="button" id="pause-button" class="hidden" aria-label="Pause game" title="Pause (P)">Pause</button>
  <div id="pause-screen" class="hidden" role="status" aria-live="polite">
    <div class="pause-content">
      <h2>Paused</h2>
      <p class="pause-hint">Press <strong>P</strong> or <strong>Space</strong> to resume<br>(or tap this screen)</p>
      <button type="button" id="resume-button">Resume</button>
    </div>
  </div>
</div>
<script>
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');

// the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
// (e.g. 16 * 25 = 400)
var grid = 16;

// ---- Speed / timing configuration ----
// Snake movement uses a fixed timestep so the speed is identical on every
// display, regardless of the monitor's refresh rate (60 / 120 / 144 Hz).
// Previously the loop skipped a fixed number of animation frames (assuming
// 60fps), which made the snake run ~2x too fast on high-refresh-rate screens
// and felt too fast for beginners.
//
// INITIAL_TICK_MS is the single canonical starting-speed value: the number of
// milliseconds between snake moves. Larger = slower / more beginner-friendly.
var INITIAL_TICK_MS = 150;

// Current milliseconds-per-move. Speed progression is intentionally disabled
// for the MVP (a single constant speed for the whole session), so this stays
// equal to INITIAL_TICK_MS. To add progression later, adjust tickMs from a
// documented rule (e.g. decrease it every N apples eaten).
var tickMs = INITIAL_TICK_MS;

// timestamp (DOMHighResTimeStamp, ms) of the last snake move; drives the
// fixed-timestep accumulator in loop().
var lastMoveTime = 0;

// dev-only instrumentation: enable by adding ?debug=1 to the URL. Logs the
// effective interval between moves so QA can confirm the tick rate is
// consistent across browsers/devices. Silent during normal play.
var DEBUG = /[?&]debug=1(?:&|$)/.test(window.location.search);
var prevMoveTime = 0;

var snake = {
  x: 160,
  y: 160,

  // snake velocity. moves one grid length every frame in either the x or y direction
  dx: grid,
  dy: 0,

  // keep track of all grids the snake body occupies
  cells: [],

  // length of the snake. grows when eating an apple
  maxCells: 4
};
var apple = {
  x: 320,
  y: 320
};

// get random whole numbers in a specific range
// @see https://stackoverflow.com/a/1527820/2124254
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// game loop
function loop(timestamp) {
  requestAnimationFrame(loop);

  // While paused, keep the animation-frame chain alive but apply no game
  // updates: no movement, collision checks, scoring, or apple spawning. The
  // last frame stays frozen on the canvas with the paused overlay on top.
  if (paused) {
    return;
  }

  // Fixed timestep: only advance the game once at least tickMs of real time has
  // elapsed since the last move. This decouples the snake's speed from the
  // display refresh rate, so it ticks at the same rate on 60/120/144 Hz screens.
  if (timestamp - lastMoveTime < tickMs) {
    return;
  }

  // Advance the marker by exactly one interval so the cadence stays locked to
  // tickMs (rather than snapping to whole animation frames). If the tab was
  // backgrounded and we've fallen far behind, resync to now instead of bursting
  // several moves to "catch up".
  lastMoveTime += tickMs;
  if (timestamp - lastMoveTime > tickMs) {
    lastMoveTime = timestamp;
  }

  if (DEBUG) {
    if (prevMoveTime) {
      console.log('[snake] move interval ' + Math.round(timestamp - prevMoveTime) +
                  'ms (target ' + tickMs + 'ms)');
    }
    prevMoveTime = timestamp;
  }

  context.clearRect(0,0,canvas.width,canvas.height);

  // move snake by it's velocity
  snake.x += snake.dx;
  snake.y += snake.dy;

  // wrap snake position horizontally on edge of screen
  if (snake.x < 0) {
    snake.x = canvas.width - grid;
  }
  else if (snake.x >= canvas.width) {
    snake.x = 0;
  }

  // wrap snake position vertically on edge of screen
  if (snake.y < 0) {
    snake.y = canvas.height - grid;
  }
  else if (snake.y >= canvas.height) {
    snake.y = 0;
  }

  // keep track of where snake has been. front of the array is always the head
  snake.cells.unshift({x: snake.x, y: snake.y});

  // remove cells as we move away from them
  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  // draw apple
  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid-1, grid-1);

  // draw snake one cell at a time
  context.fillStyle = 'green';
  snake.cells.forEach(function(cell, index) {

    // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
    context.fillRect(cell.x, cell.y, grid-1, grid-1);

    // snake ate apple
    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;

      // canvas is 400x400 which is 25x25 grids
      apple.x = getRandomInt(0, 25) * grid;
      apple.y = getRandomInt(0, 25) * grid;
    }

    // check collision with all cells after this one (modified bubble sort)
    for (var i = index + 1; i < snake.cells.length; i++) {

      // snake occupies same space as a body part. reset game
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;

        apple.x = getRandomInt(0, 25) * grid;
        apple.y = getRandomInt(0, 25) * grid;
      }
    }
  });
}

// listen to keyboard events to move the snake
document.addEventListener('keydown', function(e) {
  // ignore all gameplay keys until the game has started from the start screen
  if (!running) {
    return;
  }

  // pause / resume shortcut: P or Space. Works whether currently paused or
  // running so it always toggles. preventDefault stops Space from scrolling
  // the page.
  if (e.which === 80 || e.which === 32) {
    e.preventDefault();
    togglePause();
    return;
  }

  // while paused, ignore movement input (resume is handled above) so the
  // direction can't be changed mid-pause and the resumed run is identical
  // to the paused state
  if (paused) {
    return;
  }

  // prevent snake from backtracking on itself by checking that it's
  // not already moving on the same axis (pressing left while moving
  // left won't do anything, and pressing right while moving left
  // shouldn't let you collide with your own body)

  // left arrow key
  if (e.which === 37 && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  }
  // up arrow key
  else if (e.which === 38 && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  }
  // right arrow key
  else if (e.which === 39 && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  }
  // down arrow key
  else if (e.which === 40 && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
});

// start screen: the game waits in a "not started" state until Play is pressed
var running = false;
var loopStarted = false;
var paused = false;
var startScreen = document.getElementById('start-screen');
var playButton = document.getElementById('play-button');
var pauseButton = document.getElementById('pause-button');
var pauseScreen = document.getElementById('pause-screen');

// reset all game state back to its initial values
function resetGame() {
  snake.x = 160;
  snake.y = 160;
  snake.dx = grid;
  snake.dy = 0;
  snake.cells = [];
  snake.maxCells = 4;

  apple.x = 320;
  apple.y = 320;

  // reset speed back to the initial value and re-arm the fixed-timestep clock
  tickMs = INITIAL_TICK_MS;
  lastMoveTime = 0;
  prevMoveTime = 0;
}

// dismiss the start screen and begin gameplay
function startGame() {
  resetGame();
  startScreen.classList.add('hidden');
  running = true;

  // reveal the in-game pause control and make sure we start un-paused
  pauseButton.classList.remove('hidden');
  setPaused(false);

  // move focus off the button so gameplay keys aren't captured by it
  playButton.blur();

  // only ever kick off a single game loop
  if (!loopStarted) {
    loopStarted = true;
    requestAnimationFrame(loop);
  }
}

// ---- Pause / resume ----
// setPaused is the single source of truth for pause state and is idempotent:
// calling it with the state we're already in does nothing, so mashing pause or
// resume (keyboard, button, overlay tap, or auto-pause) can't corrupt the run.
function setPaused(next) {
  // pausing only makes sense during an active run
  if (next && !running) {
    return;
  }
  if (next === paused) {
    return;
  }

  paused = next;

  if (paused) {
    pauseScreen.classList.remove('hidden');
    pauseButton.textContent = 'Resume';
    pauseButton.setAttribute('aria-label', 'Resume game');
    pauseButton.title = 'Resume (P)';
  } else {
    pauseScreen.classList.add('hidden');
    pauseButton.textContent = 'Pause';
    pauseButton.setAttribute('aria-label', 'Pause game');
    pauseButton.title = 'Pause (P)';

    // Re-arm the fixed-timestep clock to "now" so the snake waits a full
    // interval before its next move. This avoids both a speed jump and a burst
    // of "catch-up" moves after a long (or backgrounded-tab) pause.
    lastMoveTime = performance.now();
    prevMoveTime = 0;
  }
}

function togglePause() {
  setPaused(!paused);
}

// Play is actionable by mouse click and by keyboard (Enter/Space fire a click)
playButton.addEventListener('click', startGame);

// pause control: clicking/tapping toggles pause, then hands focus back to the
// game so keyboard play keeps working
pauseButton.addEventListener('click', function() {
  togglePause();
  pauseButton.blur();
});

// the paused overlay doubles as a large tap-to-resume target (mobile-friendly);
// the Resume button inside it resumes via the same handler as it bubbles up
pauseScreen.addEventListener('click', function() {
  setPaused(false);
});

// Fairness: auto-pause when the tab becomes hidden or the window loses focus so
// a run can't advance (or end) while the player is away. We never auto-resume,
// so the player returns to the paused overlay and resumes deliberately.
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    setPaused(true);
  }
});
window.addEventListener('blur', function() {
  setPaused(true);
});

// focus Play on load so keyboard-only players can start immediately
playButton.focus();
</script>
</body>
</html>
