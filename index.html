<!DOCTYPE html>
<html>
<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">
  <!-- match the layout to the device width and cover the safe-area (notch) so
       env(safe-area-inset-*) below has something to work with. user-scalable=no
       stops accidental pinch-zoom while steering the snake on a phone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: black;
    /* the game fills the viewport, so keep the page itself from
       scrolling/bouncing behind it on mobile. */
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* column layout: HUD on top, playfield below, swipe hint at the bottom.
     centred in the viewport and padded for iOS safe-area insets so nothing
     hides under a notch or home indicator. dvh (with a vh fallback) tracks the
     *visible* viewport as mobile browser chrome shows/hides. */
  #game-area {
    box-sizing: border-box;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding:
      calc(8px + env(safe-area-inset-top))
      calc(8px + env(safe-area-inset-right))
      calc(8px + env(safe-area-inset-bottom))
      calc(8px + env(safe-area-inset-left));
  }

  #hud {
    display: flex;
    gap: 12px;
    width: min(96vw, 400px);
  }
  .hud-button {
    flex: 1 1 0;
    /* ~44px minimum tap target for comfortable touch use */
    min-height: 44px;
    padding: 10px 16px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    /* remove the 300ms tap delay / avoid double-tap zoom on the buttons */
    touch-action: manipulation;
  }
  .hud-button:hover {
    background: #5bc75f;
  }
  .hud-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  canvas {
    border: 1px solid white;
    /* Keep the internal resolution at 400x400 (the game logic and collision
       maths assume a 25x25 grid of 16px cells) but scale the *rendered* size to
       fit the viewport in either orientation. min() takes the tightest of: the
       page width, the height left over after the HUD/hint, and the native
       400px so the board never upscales/blurs on desktop. The two pairs give a
       vh fallback for browsers without dvh support. */
    width: min(96vw, calc(100vh - 120px), 400px);
    height: min(96vw, calc(100vh - 120px), 400px);
    width: min(96vw, calc(100dvh - 120px), 400px);
    height: min(96vw, calc(100dvh - 120px), 400px);
    /* treat touches on the board as game input, not page scroll/zoom */
    touch-action: none;
  }

  #touch-hint {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    color: #bbbbbb;
    text-align: center;
  }
  /* the swipe hint is only relevant on touch devices; hide it for
     mouse/keyboard (fine pointer) desktops. */
  @media (hover: hover) and (pointer: fine) {
    #touch-hint {
      display: none;
    }
  }

  /* start screen / main menu overlay */
  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.92);
    z-index: 10;
    overflow-y: auto;
  }
  #start-screen.hidden {
    display: none;
  }
  .menu {
    width: 100%;
    max-width: 360px;
    text-align: center;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .menu h1 {
    margin: 0 0 12px;
    font-size: 40px;
    letter-spacing: 2px;
    color: #4caf50;
  }
  .menu .goal {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.5;
  }
  .how-to-play {
    text-align: left;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 8px;
  }
  .how-to-play h2 {
    margin: 0 0 8px;
    font-size: 16px;
    color: #ffffff;
  }
  .how-to-play ul {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  #play-button {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #play-button:hover {
    background: #5bc75f;
  }
  #play-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  </style>
</head>
<body>
<div id="start-screen">
  <div class="menu">
    <h1>Snake</h1>
    <p class="goal">Eat the red apples to grow as long as you can &mdash; just don't crash into your own tail!</p>
    <div class="how-to-play">
      <h2>How to play</h2>
      <ul>
        <li><strong>Arrow keys</strong> &mdash; move up, down, left, and right</li>
        <li><strong>Swipe</strong> on the board &mdash; steer on a touchscreen</li>
      </ul>
    </div>
    <button type="button" id="play-button">Play</button>
  </div>
</div>
<div id="game-area">
  <div id="hud">
    <button type="button" id="pause-button" class="hud-button">Pause</button>
    <button type="button" id="restart-button" class="hud-button">Restart</button>
  </div>
  <canvas width="400" height="400" id="game"></canvas>
  <p id="touch-hint">Swipe on the board to steer</p>
</div>
<script>
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');

// the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
// (e.g. 16 * 25 = 400)
var grid = 16;

// ---- Speed / timing configuration ----
// Snake movement uses a fixed timestep so the speed is identical on every
// display, regardless of the monitor's refresh rate (60 / 120 / 144 Hz).
// Previously the loop skipped a fixed number of animation frames (assuming
// 60fps), which made the snake run ~2x too fast on high-refresh-rate screens
// and felt too fast for beginners.
//
// INITIAL_TICK_MS is the single canonical starting-speed value: the number of
// milliseconds between snake moves. Larger = slower / more beginner-friendly.
var INITIAL_TICK_MS = 150;

// Current milliseconds-per-move. Speed progression is intentionally disabled
// for the MVP (a single constant speed for the whole session), so this stays
// equal to INITIAL_TICK_MS. To add progression later, adjust tickMs from a
// documented rule (e.g. decrease it every N apples eaten).
var tickMs = INITIAL_TICK_MS;

// timestamp (DOMHighResTimeStamp, ms) of the last snake move; drives the
// fixed-timestep accumulator in loop().
var lastMoveTime = 0;

// dev-only instrumentation: enable by adding ?debug=1 to the URL. Logs the
// effective interval between moves so QA can confirm the tick rate is
// consistent across browsers/devices. Silent during normal play.
var DEBUG = /[?&]debug=1(?:&|$)/.test(window.location.search);
var prevMoveTime = 0;

var snake = {
  x: 160,
  y: 160,

  // snake velocity. moves one grid length every frame in either the x or y direction
  dx: grid,
  dy: 0,

  // keep track of all grids the snake body occupies
  cells: [],

  // length of the snake. grows when eating an apple
  maxCells: 4
};
var apple = {
  x: 320,
  y: 320
};

// get random whole numbers in a specific range
// @see https://stackoverflow.com/a/1527820/2124254
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// game loop
function loop(timestamp) {
  requestAnimationFrame(loop);

  // when paused, hold the game in place. keep the fixed-timestep clock in sync
  // with real time so resuming doesn't fire a burst of "catch-up" moves.
  if (paused) {
    lastMoveTime = timestamp;
    return;
  }

  // Fixed timestep: only advance the game once at least tickMs of real time has
  // elapsed since the last move. This decouples the snake's speed from the
  // display refresh rate, so it ticks at the same rate on 60/120/144 Hz screens.
  if (timestamp - lastMoveTime < tickMs) {
    return;
  }

  // Advance the marker by exactly one interval so the cadence stays locked to
  // tickMs (rather than snapping to whole animation frames). If the tab was
  // backgrounded and we've fallen far behind, resync to now instead of bursting
  // several moves to "catch up".
  lastMoveTime += tickMs;
  if (timestamp - lastMoveTime > tickMs) {
    lastMoveTime = timestamp;
  }

  if (DEBUG) {
    if (prevMoveTime) {
      console.log('[snake] move interval ' + Math.round(timestamp - prevMoveTime) +
                  'ms (target ' + tickMs + 'ms)');
    }
    prevMoveTime = timestamp;
  }

  context.clearRect(0,0,canvas.width,canvas.height);

  // move snake by it's velocity
  snake.x += snake.dx;
  snake.y += snake.dy;

  // wrap snake position horizontally on edge of screen
  if (snake.x < 0) {
    snake.x = canvas.width - grid;
  }
  else if (snake.x >= canvas.width) {
    snake.x = 0;
  }

  // wrap snake position vertically on edge of screen
  if (snake.y < 0) {
    snake.y = canvas.height - grid;
  }
  else if (snake.y >= canvas.height) {
    snake.y = 0;
  }

  // keep track of where snake has been. front of the array is always the head
  snake.cells.unshift({x: snake.x, y: snake.y});

  // remove cells as we move away from them
  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  // draw apple
  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid-1, grid-1);

  // draw snake one cell at a time
  context.fillStyle = 'green';
  snake.cells.forEach(function(cell, index) {

    // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
    context.fillRect(cell.x, cell.y, grid-1, grid-1);

    // snake ate apple
    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;

      // canvas is 400x400 which is 25x25 grids
      apple.x = getRandomInt(0, 25) * grid;
      apple.y = getRandomInt(0, 25) * grid;
    }

    // check collision with all cells after this one (modified bubble sort)
    for (var i = index + 1; i < snake.cells.length; i++) {

      // snake occupies same space as a body part. reset game
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;

        apple.x = getRandomInt(0, 25) * grid;
        apple.y = getRandomInt(0, 25) * grid;
      }
    }
  });
}

// Change the snake's heading. Shared by the keyboard, swipe and (future)
// on-screen controls so the "no 180° reversal" rule lives in one place: a turn
// onto the axis the snake is already travelling is ignored, which prevents the
// snake from instantly doubling back into its own neck.
function changeDirection(dir) {
  // ignore input until a game is actually running / while it's paused
  if (!running || paused) {
    return;
  }

  if (dir === 'left' && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  }
  else if (dir === 'up' && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  }
  else if (dir === 'right' && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  }
  else if (dir === 'down' && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
}

// listen to keyboard events to move the snake
document.addEventListener('keydown', function(e) {
  // left arrow key
  if (e.which === 37) {
    changeDirection('left');
  }
  // up arrow key
  else if (e.which === 38) {
    changeDirection('up');
  }
  // right arrow key
  else if (e.which === 39) {
    changeDirection('right');
  }
  // down arrow key
  else if (e.which === 40) {
    changeDirection('down');
  }
});

// ---- Touch steering (swipe) ----
// Swiping across the board changes direction. We track a moving anchor point
// and fire a turn as soon as the finger travels past SWIPE_THRESHOLD on the
// dominant axis, then re-anchor so a single continuous drag can queue several
// turns. Small jitters below the threshold are ignored so a tap doesn't turn
// the snake. Reversal protection is handled by changeDirection().
var SWIPE_THRESHOLD = 24;
var touchStartX = 0;
var touchStartY = 0;
var swiping = false;

canvas.addEventListener('touchstart', function(e) {
  var touch = e.changedTouches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  swiping = true;
  // stop the browser from scrolling/zooming from a touch on the board
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  if (!swiping) {
    return;
  }

  var touch = e.changedTouches[0];
  var dx = touch.clientX - touchStartX;
  var dy = touch.clientY - touchStartY;

  // ignore micro-swipes below the threshold on both axes
  if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) {
    e.preventDefault();
    return;
  }

  // steer along whichever axis the finger moved furthest on
  if (Math.abs(dx) > Math.abs(dy)) {
    changeDirection(dx > 0 ? 'right' : 'left');
  }
  else {
    changeDirection(dy > 0 ? 'down' : 'up');
  }

  // re-anchor so the next flick within the same drag is measured afresh
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  swiping = false;
  e.preventDefault();
}, { passive: false });

// start screen: the game waits in a "not started" state until Play is pressed
var running = false;
var paused = false;
var loopStarted = false;
var startScreen = document.getElementById('start-screen');
var playButton = document.getElementById('play-button');
var pauseButton = document.getElementById('pause-button');
var restartButton = document.getElementById('restart-button');

// reset all game state back to its initial values
function resetGame() {
  snake.x = 160;
  snake.y = 160;
  snake.dx = grid;
  snake.dy = 0;
  snake.cells = [];
  snake.maxCells = 4;

  apple.x = 320;
  apple.y = 320;

  // reset speed back to the initial value and re-arm the fixed-timestep clock
  tickMs = INITIAL_TICK_MS;
  lastMoveTime = 0;
  prevMoveTime = 0;
}

// make sure the game loop is running (only ever kicked off once)
function ensureLoopStarted() {
  if (!loopStarted) {
    loopStarted = true;
    requestAnimationFrame(loop);
  }
}

// dismiss the start screen and begin gameplay
function startGame() {
  resetGame();
  paused = false;
  pauseButton.textContent = 'Pause';
  startScreen.classList.add('hidden');
  running = true;

  // move focus off the button so gameplay keys aren't captured by it
  playButton.blur();

  ensureLoopStarted();
}

// draw a translucent "Paused" overlay over the last rendered frame
function drawPausedOverlay() {
  context.fillStyle = 'rgba(0, 0, 0, 0.6)';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = '#ffffff';
  context.font = 'bold 28px Arial, Helvetica, sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText('Paused', canvas.width / 2, canvas.height / 2);
}

// pause / resume the game
function togglePause() {
  if (!running) {
    return;
  }
  paused = !paused;
  pauseButton.textContent = paused ? 'Resume' : 'Pause';
  if (paused) {
    drawPausedOverlay();
  }
  // don't leave keyboard focus on the button, or arrow keys get swallowed
  pauseButton.blur();
}

// restart from scratch (usable mid-game, from a paused state, or from the
// start screen)
function restartGame() {
  resetGame();
  paused = false;
  pauseButton.textContent = 'Pause';
  startScreen.classList.add('hidden');
  running = true;
  restartButton.blur();
  ensureLoopStarted();
}

// Play is actionable by mouse click and by keyboard (Enter/Space fire a click)
playButton.addEventListener('click', startGame);
pauseButton.addEventListener('click', togglePause);
restartButton.addEventListener('click', restartGame);

// focus Play on load so keyboard-only players can start immediately
playButton.focus();
</script>
</body>
</html>
