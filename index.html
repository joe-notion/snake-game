<!DOCTYPE html>
<html>
<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    border: 1px solid white;
  }

  /* start screen / main menu overlay */
  #start-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.92);
    z-index: 10;
  }
  #start-screen.hidden {
    display: none;
  }
  .menu {
    width: 100%;
    max-width: 360px;
    text-align: center;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .menu h1 {
    margin: 0 0 12px;
    font-size: 40px;
    letter-spacing: 2px;
    color: #4caf50;
  }
  .menu .goal {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.5;
  }
  .how-to-play {
    text-align: left;
    margin: 0 0 24px;
    padding: 12px 16px;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 8px;
  }
  .how-to-play h2 {
    margin: 0 0 8px;
    font-size: 16px;
    color: #ffffff;
  }
  .how-to-play ul {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .how-to-play .mobile-note {
    margin: 10px 0 0;
    font-size: 13px;
    color: #bbbbbb;
  }
  #play-button {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: bold;
    color: #000000;
    background: #4caf50;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #play-button:hover {
    background: #5bc75f;
  }
  #play-button:focus {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }
  </style>
</head>
<body>
<div id="start-screen">
  <div class="menu">
    <h1>Snake</h1>
    <p class="goal">Eat the red apples to grow as long as you can &mdash; just don't crash into your own tail!</p>
    <div class="how-to-play">
      <h2>How to play</h2>
      <ul>
        <li><strong>Arrow keys</strong> &mdash; move up, down, left, and right</li>
      </ul>
      <p class="mobile-note">Mobile touch controls coming soon.</p>
    </div>
    <button type="button" id="play-button">Play</button>
  </div>
</div>
<canvas width="400" height="400" id="game"></canvas>
<script>
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');

// the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
// (e.g. 16 * 25 = 400)
var grid = 16;

// ---- Speed / timing configuration ----
// Snake movement uses a fixed timestep so the speed is identical on every
// display, regardless of the monitor's refresh rate (60 / 120 / 144 Hz).
// Previously the loop skipped a fixed number of animation frames (assuming
// 60fps), which made the snake run ~2x too fast on high-refresh-rate screens
// and felt too fast for beginners.
//
// INITIAL_TICK_MS is the single canonical starting-speed value: the number of
// milliseconds between snake moves. Larger = slower / more beginner-friendly.
var INITIAL_TICK_MS = 150;

// Current milliseconds-per-move. Speed progression is intentionally disabled
// for the MVP (a single constant speed for the whole session), so this stays
// equal to INITIAL_TICK_MS. To add progression later, adjust tickMs from a
// documented rule (e.g. decrease it every N apples eaten).
var tickMs = INITIAL_TICK_MS;

// timestamp (DOMHighResTimeStamp, ms) of the last snake move; drives the
// fixed-timestep accumulator in loop().
var lastMoveTime = 0;

// dev-only instrumentation: enable by adding ?debug=1 to the URL. Logs the
// effective interval between moves so QA can confirm the tick rate is
// consistent across browsers/devices. Silent during normal play.
var DEBUG = /[?&]debug=1(?:&|$)/.test(window.location.search);
var prevMoveTime = 0;

var snake = {
  x: 160,
  y: 160,

  // snake velocity. moves one grid length every frame in either the x or y direction
  dx: grid,
  dy: 0,

  // keep track of all grids the snake body occupies
  cells: [],

  // length of the snake. grows when eating an apple
  maxCells: 4
};
var apple = {
  x: 320,
  y: 320
};

// ---- Bonus / special food configuration ----
// A time-limited "golden apple" appears occasionally for bonus points. It is
// visually distinct from the normal apple, awards points only (it does not
// grow the snake, keeping core gameplay unchanged), and vanishes if it isn't
// eaten before its timer runs out.
var APPLE_POINTS = 1;        // points for eating a normal apple
var GOLDEN_POINTS = 5;       // bonus points for eating the golden apple in time
var GOLDEN_EVERY = 5;        // spawn a golden apple after every N normal apples
var GOLDEN_LIFETIME_MS = 6000; // how long the golden apple stays on screen (~6s)
var GOLDEN_BLINK_MS = 2000;  // starts blinking during its final 2s before expiry

// running score and how many normal apples have been eaten (drives the golden
// apple's spawn cadence).
var score = 0;
var applesEaten = 0;

// the golden apple. `active` is false when there is no golden apple on the
// board; `expiresAt` is the timestamp (ms) at which it disappears.
var golden = {
  x: 0,
  y: 0,
  active: false,
  expiresAt: 0
};

// get random whole numbers in a specific range
// @see https://stackoverflow.com/a/1527820/2124254
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

// pick a random grid cell that is not occupied by the snake or the normal
// apple. This keeps the golden apple from spawning on top of the player or the
// existing food (an "invalid tile"). Returns null if no free cell is found.
function getRandomFreeCell() {
  // 25x25 grid = 625 cells; a bounded number of attempts is plenty and avoids
  // any risk of an infinite loop if the board is nearly full.
  for (var attempt = 0; attempt < 200; attempt++) {
    var x = getRandomInt(0, 25) * grid;
    var y = getRandomInt(0, 25) * grid;

    // don't overlap the normal apple
    if (x === apple.x && y === apple.y) {
      continue;
    }

    // don't overlap any part of the snake (cells + the head's current position)
    var occupied = (snake.x === x && snake.y === y);
    for (var i = 0; !occupied && i < snake.cells.length; i++) {
      if (snake.cells[i].x === x && snake.cells[i].y === y) {
        occupied = true;
      }
    }

    if (!occupied) {
      return {x: x, y: y};
    }
  }
  return null;
}

// place a fresh golden apple on a valid free tile and arm its expiry timer.
function spawnGolden(timestamp) {
  var cell = getRandomFreeCell();
  if (!cell) {
    return; // board effectively full; skip this spawn
  }
  golden.x = cell.x;
  golden.y = cell.y;
  golden.active = true;
  golden.expiresAt = timestamp + GOLDEN_LIFETIME_MS;
}

// game loop
function loop(timestamp) {
  requestAnimationFrame(loop);

  // Fixed timestep: only advance the game once at least tickMs of real time has
  // elapsed since the last move. This decouples the snake's speed from the
  // display refresh rate, so it ticks at the same rate on 60/120/144 Hz screens.
  if (timestamp - lastMoveTime < tickMs) {
    return;
  }

  // Advance the marker by exactly one interval so the cadence stays locked to
  // tickMs (rather than snapping to whole animation frames). If the tab was
  // backgrounded and we've fallen far behind, resync to now instead of bursting
  // several moves to "catch up".
  lastMoveTime += tickMs;
  if (timestamp - lastMoveTime > tickMs) {
    lastMoveTime = timestamp;
  }

  if (DEBUG) {
    if (prevMoveTime) {
      console.log('[snake] move interval ' + Math.round(timestamp - prevMoveTime) +
                  'ms (target ' + tickMs + 'ms)');
    }
    prevMoveTime = timestamp;
  }

  context.clearRect(0,0,canvas.width,canvas.height);

  // move snake by it's velocity
  snake.x += snake.dx;
  snake.y += snake.dy;

  // wrap snake position horizontally on edge of screen
  if (snake.x < 0) {
    snake.x = canvas.width - grid;
  }
  else if (snake.x >= canvas.width) {
    snake.x = 0;
  }

  // wrap snake position vertically on edge of screen
  if (snake.y < 0) {
    snake.y = canvas.height - grid;
  }
  else if (snake.y >= canvas.height) {
    snake.y = 0;
  }

  // keep track of where snake has been. front of the array is always the head
  snake.cells.unshift({x: snake.x, y: snake.y});

  // remove cells as we move away from them
  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  // draw apple
  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid-1, grid-1);

  // expire the golden apple once its lifetime has elapsed (eating it after this
  // point awards nothing, so bonus points only count when collected in time)
  if (golden.active && timestamp >= golden.expiresAt) {
    golden.active = false;
  }

  // draw the golden (bonus) apple. It is a distinct gold colour with a lighter
  // inner highlight, and blinks during its final seconds so the player can
  // clearly see it is about to disappear.
  if (golden.active) {
    var remaining = golden.expiresAt - timestamp;
    var visible = true;
    if (remaining <= GOLDEN_BLINK_MS) {
      // toggle roughly every 200ms to produce an obvious warning blink
      visible = Math.floor(remaining / 200) % 2 === 0;
    }
    if (visible) {
      context.fillStyle = 'gold';
      context.fillRect(golden.x, golden.y, grid-1, grid-1);
      context.fillStyle = '#fff3b0';
      context.fillRect(golden.x + 4, golden.y + 4, grid-9, grid-9);
    }
  }

  // draw the score in the top-left corner
  context.fillStyle = 'white';
  context.font = '16px Arial';
  context.textBaseline = 'top';
  context.fillText('Score: ' + score, 8, 8);

  // draw snake one cell at a time
  context.fillStyle = 'green';
  snake.cells.forEach(function(cell, index) {

    // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
    context.fillRect(cell.x, cell.y, grid-1, grid-1);

    // snake ate apple
    if (cell.x === apple.x && cell.y === apple.y) {
      snake.maxCells++;
      score += APPLE_POINTS;
      applesEaten++;

      // canvas is 400x400 which is 25x25 grids
      apple.x = getRandomInt(0, 25) * grid;
      apple.y = getRandomInt(0, 25) * grid;

      // reward the player with a time-limited golden apple every N apples
      if (!golden.active && applesEaten % GOLDEN_EVERY === 0) {
        spawnGolden(timestamp);
      }
    }

    // snake ate the golden apple while it was still active: award bonus points.
    // It does not grow the snake, so core gameplay stays the same.
    if (golden.active && cell.x === golden.x && cell.y === golden.y) {
      score += GOLDEN_POINTS;
      golden.active = false;
    }

    // check collision with all cells after this one (modified bubble sort)
    for (var i = index + 1; i < snake.cells.length; i++) {

      // snake occupies same space as a body part. reset game
      if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;

        apple.x = getRandomInt(0, 25) * grid;
        apple.y = getRandomInt(0, 25) * grid;

        // clear bonus-food state so the next life starts fresh
        score = 0;
        applesEaten = 0;
        golden.active = false;
      }
    }
  });
}

// listen to keyboard events to move the snake
document.addEventListener('keydown', function(e) {
  // ignore movement keys until the game has started from the start screen
  if (!running) {
    return;
  }

  // prevent snake from backtracking on itself by checking that it's
  // not already moving on the same axis (pressing left while moving
  // left won't do anything, and pressing right while moving left
  // shouldn't let you collide with your own body)

  // left arrow key
  if (e.which === 37 && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  }
  // up arrow key
  else if (e.which === 38 && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  }
  // right arrow key
  else if (e.which === 39 && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  }
  // down arrow key
  else if (e.which === 40 && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
});

// start screen: the game waits in a "not started" state until Play is pressed
var running = false;
var loopStarted = false;
var startScreen = document.getElementById('start-screen');
var playButton = document.getElementById('play-button');

// reset all game state back to its initial values
function resetGame() {
  snake.x = 160;
  snake.y = 160;
  snake.dx = grid;
  snake.dy = 0;
  snake.cells = [];
  snake.maxCells = 4;

  apple.x = 320;
  apple.y = 320;

  // reset bonus-food state
  score = 0;
  applesEaten = 0;
  golden.active = false;

  // reset speed back to the initial value and re-arm the fixed-timestep clock
  tickMs = INITIAL_TICK_MS;
  lastMoveTime = 0;
  prevMoveTime = 0;
}

// dismiss the start screen and begin gameplay
function startGame() {
  resetGame();
  startScreen.classList.add('hidden');
  running = true;

  // move focus off the button so gameplay keys aren't captured by it
  playButton.blur();

  // only ever kick off a single game loop
  if (!loopStarted) {
    loopStarted = true;
    requestAnimationFrame(loop);
  }
}

// Play is actionable by mouse click and by keyboard (Enter/Space fire a click)
playButton.addEventListener('click', startGame);

// focus Play on load so keyboard-only players can start immediately
playButton.focus();
</script>
</body>
</html>
